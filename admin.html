<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | MD. MASUDUL HASAN</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: '#050505',
                        primary: '#00f2ff',
                        secondary: '#4d4dff',
                        text: '#e0e0e0',
                        'glass-bg': 'rgba(255, 255, 255, 0.05)',
                        'glass-border': 'rgba(255, 255, 255, 0.1)',
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(0, 242, 255, 0.5), 0 0 20px rgba(0, 242, 255, 0.3)',
                    }
                }
            }
        }
    </script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body class="bg-bg text-text font-sans min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-10">

        <!-- ==================== LOGIN VIEW ==================== -->
        <div id="login-view" class="hidden">
            <div class="max-w-md mx-auto">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-white">Admin Login</h1>
                    <p class="text-gray-400 mt-2">Sign in to manage contact messages</p>
                </div>

                <div class="rounded-xl bg-bg/50 border border-white/10 p-8">
                    <div class="space-y-5">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase">Email</label>
                            <input type="email" id="login-email"
                                class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                placeholder="admin@example.com" autocomplete="email">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase">Password</label>
                            <input type="password" id="login-password"
                                class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <div id="login-error" class="hidden text-sm text-red-400 bg-red-500/10 border border-red-500/30 rounded-lg px-4 py-3"></div>
                        <button id="login-btn" type="button"
                            class="w-full bg-primary text-black font-bold py-3 rounded-lg hover:bg-white transition-colors uppercase tracking-widest text-sm shadow-[0_0_15px_rgba(0,242,255,0.3)] hover:shadow-[0_0_25px_rgba(0,242,255,0.5)]">
                            Sign In
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== DASHBOARD VIEW ==================== -->
        <div id="dashboard-view" class="hidden">
            <!-- Header -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white">Contact Messages</h1>
                    <p class="text-gray-400 mt-1">Signed in as <span id="admin-email" class="text-primary"></span></p>
                </div>
                <div class="flex gap-3">
                    <button id="logout-btn" type="button"
                        class="bg-white/5 border border-white/10 text-gray-300 font-semibold py-2 px-5 rounded-lg hover:bg-white/10 transition-colors text-sm">
                        Logout
                    </button>
                </div>
            </div>

            <!-- Change password card -->
            <div class="rounded-xl bg-bg/50 border border-white/10 p-6 mb-6">
                <details>
                    <summary class="cursor-pointer text-sm font-bold text-gray-300 uppercase tracking-widest">Change Password</summary>
                    <div class="mt-4 grid md:grid-cols-3 gap-4">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase">Current</label>
                            <input type="password" id="pw-current"
                                class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                placeholder="••••••••" autocomplete="current-password">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase">New</label>
                            <input type="password" id="pw-new"
                                class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary transition-colors text-sm"
                                placeholder="Min 8 characters" autocomplete="new-password">
                        </div>
                        <div class="flex items-end">
                            <button id="pw-change-btn" type="button"
                                class="w-full bg-white/5 border border-white/10 text-gray-300 font-semibold py-3 px-5 rounded-lg hover:bg-white/10 transition-colors text-sm">
                                Update Password
                            </button>
                        </div>
                    </div>
                    <div id="pw-message" class="mt-3 text-sm hidden"></div>
                </details>
            </div>

            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <p class="text-sm text-gray-400"><span id="msg-count" class="text-white font-bold">0</span> messages</p>
                <button id="refresh-btn" type="button"
                    class="bg-white/5 border border-white/10 text-gray-300 font-semibold py-2 px-5 rounded-lg hover:bg-white/10 transition-colors text-sm">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>

            <!-- Messages list -->
            <div id="messages-list" class="space-y-4"></div>
            <div id="messages-empty" class="hidden rounded-xl bg-bg/50 border border-white/10 p-8 text-center text-gray-400">
                No messages yet.
            </div>
        </div>

    </div>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ===== Admin page logic =====
        (async function () {
            const loginView = document.getElementById('login-view');
            const dashView = document.getElementById('dashboard-view');
            const loginBtn = document.getElementById('login-btn');
            const loginError = document.getElementById('login-error');
            const logoutBtn = document.getElementById('logout-btn');
            const refreshBtn = document.getElementById('refresh-btn');
            const messagesList = document.getElementById('messages-list');
            const messagesEmpty = document.getElementById('messages-empty');

            // --- View switching ---
            function showLogin() {
                loginView.classList.remove('hidden');
                dashView.classList.add('hidden');
            }
            function showDashboard() {
                loginView.classList.add('hidden');
                dashView.classList.remove('hidden');
            }

            // --- Message card rendering ---
            function messageCard(m) {
                const card = document.createElement('div');
                card.className = 'rounded-xl bg-bg/50 border border-white/10 p-6';

                const date = m.created_at ? new Date(m.created_at).toLocaleString() : '';

                const head = document.createElement('div');
                head.className = 'flex flex-wrap items-start justify-between gap-3 mb-3';

                const info = document.createElement('div');
                info.className = 'flex items-center gap-3';
                info.innerHTML =
                    '<div class="w-10 h-10 rounded-full bg-primary/20 border border-primary/30 flex items-center justify-center text-primary font-bold">' +
                    escapeHtml((m.name || '?').charAt(0).toUpperCase()) + '</div>' +
                    '<div>' +
                    '<div class="font-semibold text-white">' + escapeHtml(m.name || '') +
                    (m.is_read ? '' : ' <span class="ml-1 text-[10px] uppercase tracking-wider text-primary border border-primary/40 rounded px-1.5 py-0.5 align-middle">New</span>') +
                    '</div>' +
                    '<div class="text-xs text-gray-400">' + escapeHtml(m.email || '') +
                    (date ? ' &nbsp;·&nbsp; ' + escapeHtml(date) : '') + '</div>' +
                    '</div>';

                const actions = document.createElement('div');
                actions.className = 'flex items-center gap-2';
                const markBtn = document.createElement('button');
                markBtn.type = 'button';
                markBtn.className = 'bg-white/5 border border-white/10 text-gray-300 text-xs font-semibold py-1.5 px-3 rounded-lg hover:bg-white/10 transition-colors';
                markBtn.textContent = m.is_read ? 'Unread' : 'Mark read';
                markBtn.onclick = () => toggleRead(m.id, m.is_read);
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold py-1.5 px-3 rounded-lg hover:bg-red-500/20 transition-colors';
                delBtn.textContent = 'Delete';
                delBtn.onclick = () => deleteMessage(m.id);
                actions.append(markBtn, delBtn);

                head.append(info, actions);

                const body = document.createElement('div');
                body.className = 'space-y-2';
                if (m.subject) {
                    const subj = document.createElement('div');
                    subj.className = 'text-sm font-semibold text-primary';
                    subj.textContent = m.subject;
                    body.appendChild(subj);
                }
                const text = document.createElement('p');
                text.className = 'text-sm text-gray-300 whitespace-pre-wrap';
                text.textContent = m.message || '';
                body.appendChild(text);

                card.append(head, body);
                return card;
            }

            function escapeHtml(s) {
                const div = document.createElement('div');
                div.textContent = s == null ? '' : String(s);
                return div.innerHTML;
            }

            // --- Load messages (authenticated reads only) ---
            async function loadMessages() {
                const { data, error } = await window.supabase
                    .from('contact_messages')
                    .select('*')
                    .order('created_at', { ascending: false });

                messagesList.innerHTML = '';
                if (error) {
                    console.error('loadMessages error:', error.message);
                    messagesList.innerHTML = '<div class="rounded-xl bg-bg/50 border border-white/10 p-8 text-center text-red-400">Failed to load messages: ' + escapeHtml(error.message) + '</div>';
                    messagesEmpty.classList.add('hidden');
                    document.getElementById('msg-count').textContent = '0';
                    return;
                }

                document.getElementById('msg-count').textContent = data.length;
                messagesEmpty.classList.toggle('hidden', data.length > 0);
                data.forEach(m => messagesList.appendChild(messageCard(m)));
            }

            async function toggleRead(id, isRead) {
                const { error } = await window.supabase
                    .from('contact_messages')
                    .update({ is_read: !isRead })
                    .eq('id', id);
                if (error) { console.error('toggleRead error:', error.message); return; }
                await loadMessages();
            }

            async function deleteMessage(id) {
                if (!confirm('Delete this message?')) return;
                const { error } = await window.supabase
                    .from('contact_messages')
                    .delete()
                    .eq('id', id);
                if (error) { console.error('deleteMessage error:', error.message); return; }
                await loadMessages();
            }

            // --- Auth flow ---
            const { data: sessionData } = await window.supabase.auth.getSession();
            if (sessionData.session) {
                document.getElementById('admin-email').textContent = sessionData.session.user.email || '';
                showDashboard();
                await loadMessages();
            } else {
                showLogin();
            }

            loginBtn.addEventListener('click', async () => {
                loginError.classList.add('hidden');
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                if (!email || !password) {
                    loginError.textContent = 'Enter your email and password.';
                    loginError.classList.remove('hidden');
                    return;
                }
                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';
                const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
                if (error) {
                    loginError.textContent = 'Login failed: ' + error.message;
                    loginError.classList.remove('hidden');
                    return;
                }
                document.getElementById('admin-email').textContent = data.user.email || '';
                showDashboard();
                await loadMessages();
            });

            logoutBtn.addEventListener('click', async () => {
                await window.supabase.auth.signOut();
                document.getElementById('login-email').value = '';
                document.getElementById('login-password').value = '';
                showLogin();
            });

            refreshBtn.addEventListener('click', loadMessages);

            // --- Change password (optional, admin convenience) ---
            document.getElementById('pw-change-btn').addEventListener('click', async () => {
                const msg = document.getElementById('pw-message');
                const current = document.getElementById('pw-current').value;
                const next = document.getElementById('pw-new').value;
                msg.classList.add('hidden');
                if (!current || next.length < 8) {
                    msg.textContent = 'Enter current password and a new password of at least 8 characters.';
                    msg.classList.remove('hidden');
                    msg.classList.add('text-red-400');
                    return;
                }
                const { error } = await window.supabase.auth.updateUser({ password: next });
                if (error) {
                    msg.textContent = 'Password not updated: ' + error.message;
                    msg.classList.remove('hidden');
                    msg.classList.add('text-red-400');
                    return;
                }
                document.getElementById('pw-current').value = '';
                document.getElementById('pw-new').value = '';
                msg.textContent = 'Password updated successfully.';
                msg.classList.remove('hidden');
                msg.classList.add('text-emerald-400');
            });

            // Live session changes (logout in another tab, expiry)
            window.supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED') {
                    if (!session) showLogin();
                }
            });
        })();
    </script>
</body>

</html>
